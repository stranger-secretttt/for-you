<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>secret</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0f0c1b;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            pointer-events: none;
            padding: 20px;
        }

        .text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f7d6e0;
            text-shadow: 0 0 10px rgba(247, 214, 224, 0.5),
                         0 0 20px rgba(238, 155, 0, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 2.5s ease, transform 2.5s ease;
            letter-spacing: 1px;
        }

        .text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        .music-btn svg {
            width: 24px;
            height: 24px;
            fill: #f7d6e0;
        }

        .start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 27, 0.85);
            backdrop-filter: blur(5px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .start-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .start-btn {
            padding: 14px 28px;
            background: linear-gradient(135deg, #f7d6e0 0%, #f2b5d4 100%);
            color: #2b1e3a;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(247, 214, 224, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="start-overlay" id="startOverlay">
        <div class="start-btn">Sentuh Layar ❤️</div>
    </div>

    <button class="music-btn" id="musicBtn" title="Toggle Music">
        <svg viewBox="0 0 24 24" id="musicIcon">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
    </button>

    <canvas id="canvas"></canvas>

    <div class="container">
        <div class="text" id="loveText">morning manizz</div>
    </div>

<audio id="bgMusic" loop preload="auto">
    <source src="yung kai - i think of you the most (Lyrics).mp3.mpeg" type="audio/mpeg">
</audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textEl = document.getElementById('loveText');
        const overlay = document.getElementById('startOverlay');
        const musicBtn = document.getElementById('musicBtn');
        const audio = document.getElementById('bgMusic');

        let width, height;
        let particles = [];
        let heartPoints = [];
        let isStarted = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        function getHeartPoint(t) {
            const scale = Math.min(width, height) / 38;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return {
                x: width / 2 + x * scale,
                y: height / 2 + y * scale
            };
        }

        function initHeart() {
            heartPoints = [];
            const steps = 180;
            for (let i = 0; i < steps; i++) {
                const t = (Math.PI * 2 / steps) * i;
                heartPoints.push(getHeartPoint(t));
            }
        }

        const pastelColors = [
            '#f7d6e0',
            '#f2b5d4',
            '#e295b5',
            '#d883a8',
            '#b87d9b',
            '#f7aef8',
            '#e3a5c7'
        ];

        class Particle {
            constructor(target, index) {
                this.target = target;
                this.index = index;
                this.x = width / 2 + (Math.random() - 0.5) * 50;
                this.y = height / 2 + (Math.random() - 0.5) * 50;
                this.size = Math.random() * 2 + 1.5;
                this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                this.speed = 0.02 + Math.random() * 0.015;
                this.friction = 0.92;
                this.vx = 0;
                this.vy = 0;
                this.alpha = 0;
                this.delay = index * 1.5;
                this.age = 0;
            }

            update() {
                this.age++;
                if (this.age < this.delay) return;

                if (this.alpha < 1) this.alpha += 0.02;

                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;

                this.vx += dx * this.speed * 0.05;
                this.vy += dy * this.speed * 0.05;

                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx + (Math.random() - 0.5) * 0.4;
                this.y += this.vy + (Math.random() - 0.5) * 0.4;
            }

            draw() {
                if (this.age < this.delay) return;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function setup() {
            initHeart();
            particles = [];
            const totalParticles = 400;
            for (let i = 0; i < totalParticles; i++) {
                const targetIndex = i % heartPoints.length;
                particles.push(new Particle(heartPoints[targetIndex], i));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(15, 12, 27, 0.15)';
            ctx.fillRect(0, 0, width, height);

            if (isStarted) {
                let completed = 0;
                particles.forEach(p => {
                    p.update();
                    p.draw();
                    if (p.age > p.delay + 100) completed++;
                });

                if (completed > particles.length * 0.6) {
                    textEl.classList.add('show');
                }
            }

            requestAnimationFrame(animate);
        }

        function startExperience() {
            if (isStarted) return;
            isStarted = true;
            overlay.classList.add('hidden');
            
            audio.play().catch(err => {
                console.log("Audio play deferred:", err);
            });

            setup();
        }

        overlay.addEventListener('click', startExperience);
        
        let isPlaying = true;
        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isStarted) {
                startExperience();
                return;
            }
            if (isPlaying) {
                audio.pause();
                musicBtn.style.opacity = '0.5';
            } else {
                audio.play();
                musicBtn.style.opacity = '1';
            }
            isPlaying = !isPlaying;
        });

        animate();
    </script>
</body>
</html>
